name: dvizh
description: Offline local activity tracker without personal data collection
publish_to: 'none'
version: 3.9.0+13

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.7'

dependencies:
  flutter:
    sdk: flutter

  sensors_plus: 6.1.2
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path: ^1.8.3
  intl: ^0.18.1
  permission_handler: ^11.0.0
  flutter_local_notifications: 19.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  sqflite_common_ffi: 2.3.6

flutter:
  uses-material-design: true
  assets:
    - assets/sky/
